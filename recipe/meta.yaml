{% set name = "metaflow" %}
{% set version = "2.19.35" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: f349575c595151ca3fceb0f747ce6b67d74baa4ca1b71bd3f54bb8f92afdcc5e

build:
  number: 0
  skip: true  # [py<310]
  skip: true  # [win]  # upstream imports fcntl unconditionally; not in upstream classifiers
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - metaflow = metaflow.cmd.main_cli:start

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python
    - boto3
    - requests
    - setuptools
  run_constrained:
    - metaflow-stubs ==2.19.35

test:
  imports:
    - metaflow
    - metaflow.client
    - metaflow.datastore
    - metaflow.datatools
    - metaflow.metadata_provider
    - metaflow.plugins
    - metaflow.plugins.aws
    - metaflow.plugins.aws.batch
  requires:
    - pip
  commands:
    - pip check
    - metaflow --help

about:
  home: https://metaflow.org/
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: "Metaflow: More AI and ML, Less Engineering"
  doc_url: https://docs.metaflow.org/
  dev_url: https://github.com/Netflix/metaflow

extra:
  recipe-maintainers:
    - mt-ob
    - saikonen
    - savingoyal
