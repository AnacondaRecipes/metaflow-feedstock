{% set name = "metaflow" %}
{% set version = "2.19.36" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 7d1e173361c020da1a3864ed12c68ede4ee99a9e959b50f6c3a060559ee93b62

build:
  number: 0
  # Upstream imports fcntl unconditionally; not in upstream classifiers
  skip: true  # [py<310 or win]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - metaflow = metaflow.cmd.main_cli:start

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - boto3
    - requests
  run_constrained:
    - metaflow-stubs =={{ version }}

test:
  imports:
    - metaflow
    - metaflow.client
    - metaflow.datastore
    - metaflow.datatools
    - metaflow.metadata_provider
    - metaflow.plugins
    - metaflow.plugins.aws
    - metaflow.plugins.aws.batch
  requires:
    - pip
  commands:
    - pip check
    - metaflow --help

about:
  home: https://metaflow.org/
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: "Metaflow: More AI and ML, Less Engineering"
  description: |
    Metaflow is a human-centric framework designed to help scientists and engineers
    build and manage real-life AI and ML systems.
  doc_url: https://docs.metaflow.org/
  dev_url: https://github.com/Netflix/metaflow

extra:
  recipe-maintainers:
    - mt-ob
    - saikonen
    - savingoyal
