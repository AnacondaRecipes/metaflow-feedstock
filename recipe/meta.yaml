{% set name = "metaflow" %}
{% set version = "2.19.39" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
    sha256: 59fdb07d8de9e2343658871fd6d967bf9d41799abb92f5835ac792390e7e8a61
  - url: https://github.com/Netflix/metaflow/archive/refs/tags/{{ version }}.tar.gz
    sha256: 50b993cb755cde7d744cc80a3269deec063cf5bd7996796439741b8417628178
    folder: gh_src

build:
  number: 0
  # Upstream imports fcntl unconditionally; not in upstream classifiers
  skip: true  # [py<310 or win]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - metaflow = metaflow.cmd.main_cli:start

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    - requests
    - boto3
  run_constrained:
    - metaflow-stubs =={{ version }}

test:
  source_files:
    - gh_src/test
  imports:
    - metaflow
    - metaflow.client
    - metaflow.datastore
    - metaflow.datatools
    - metaflow.metadata_provider
    - metaflow.plugins
    - metaflow.plugins.aws
    - metaflow.plugins.aws.batch
  requires:
    - pip
    - pytest
    - sh
    - pytest-mock
    - pandas
    - git
  commands:
    - pip check
    - metaflow --help
    # Upstream's supported suite (tox.ini [testenv:unit]). test/core (broken --failed-dump
    # wrapper), test/ux (needs devstack) and test/data/s3 (live S3) can't run in the
    # build sandbox; test/unit/spin needs conda envs + network; docker tests are skipped.
    - pytest -vv gh_src/test/unit gh_src/test/cmd gh_src/test/plugins --ignore=gh_src/test/unit/spin -m "not docker"

about:
  home: https://metaflow.org
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  summary: "Metaflow: More AI and ML, Less Engineering"
  description: |
    Metaflow is a human-centric framework designed to help scientists and engineers
    build and manage real-life AI and ML systems.
  doc_url: https://docs.metaflow.org
  dev_url: https://github.com/Netflix/metaflow

extra:
  recipe-maintainers:
    - mt-ob
    - saikonen
    - savingoyal
